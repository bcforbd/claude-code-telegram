[project]
name = "claude-code-telegram"
version = "1.6.0"
description = "Telegram bot for remote Claude Code access with comprehensive configuration management"
readme = "README.md"
license = "MIT"
authors = [
    {name = "Richard Atkinson", email = "richardatk01@gmail.com"},
    {name = "bcforbd"},
]
keywords = ["telegram", "bot", "claude", "ai", "development", "remote", "coding"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Communications :: Chat",
    "Topic :: Software Development",
    "Topic :: System :: Shells",
]
requires-python = ">=3.11"
dynamic = ["dependencies"]

[project.urls]
Homepage = "https://github.com/bcforbd/claude-code-telegram"
Repository = "https://github.com/bcforbd/claude-code-telegram"
Documentation = "https://github.com/bcforbd/claude-code-telegram/blob/main/docs/"

[project.scripts]
claude-telegram-bot = "src.main:run"

[build-system]
requires = ["poetry-core>=2.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
packages = [{include = "src"}]

[tool.poetry.dependencies]
python = "^3.11"
python-telegram-bot = {version = "^22.8", extras = ["rate-limiter"]}
structlog = "^26.1.0"
pydantic = "^2.13.4"
pydantic-settings = "^2.15.0"
python-dotenv = "^1.2.2"
aiofiles = "^25.1.0"
aiosqlite = "^0.22.1"
anthropic = "^0.121.0"
claude-agent-sdk = "^0.2.136"
fastapi = "^0.141.1"
uvicorn = {version = "^0.52.1", extras = ["standard"]}
apscheduler = "^3.11"
PyYAML = "^6.0.2"
mistralai = {version = "^2.9.2", optional = true}
openai = {version = "^2.54.0", optional = true}

[tool.poetry.extras]
voice = ["mistralai", "openai"]

[tool.poetry.group.dev.dependencies]
pytest = "^8.4.0"
pytest-asyncio = "^1.0.0"
pytest-cov = "^6.1.1"
pytest-mock = "^3.14.1"
black = "^25.1.0"
isort = "^6.0.1"
flake8 = "^7.2.0"
mypy = "^1.16.0"
autoflake = "^2.3.2"
pre-commit = "^4.0.0"
watchfiles = "^1.1.1"

[tool.black]
line-length = 88
target-version = ['py311']

[tool.isort]
profile = "black"
line_length = 88

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
addopts = "-v --cov=src --cov-report=html --cov-report=term-missing"
asyncio_mode = "auto"

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[tool.flake8]
max-line-length = 88
extend-ignore = ["E203", "W503"]
